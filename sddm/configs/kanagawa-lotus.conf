# Kanagawa Lotus: SilentSDDM preset built on the stock default.conf, with the pixel-art
# "Great Wave" wallpaper. Palette sampled from backgrounds/great-wave-pixel.png:
#   cream #E7DEBF  sand #C0BB9E  navy #202342  teal #7BAFA3  slate #355669  gold #B6995F
# Lock screen shows the art sharp; the login screen blurs it so the form stays readable.
# Positions are tuned for an 1800x1125 logical screen (2880x1800 at 1.6 scale).
# LockScreen padding-right is shared by the clock and the message; padding-bottom keeps the
# message on the plain teal strip. The theme stacks the message icon above the text, so the
# icon is the Nerd Font login glyph (U+F0342) inside the text instead (needs Monaspace NF).

; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 0.75
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 60
padding-right = 40
padding-bottom = 20
padding-left = 0
background = "great-wave-pixel.png"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = 0.0
saturation = 0.0
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "top-right"
align = "right"
format = "hh:mm"
font-family = "Monaspace Krypton NF"
font-size = 120
font-weight = 800
color = "#202342"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "Monaspace Krypton NF"
font-size = 14
font-weight = 600
color = "#355669"
margin-top = -6

[LockScreen.Message]
display = true
position = "bottom-right"
align = "right"
text = "press any key 󰍂"
font-family = "Monaspace Krypton NF"
font-size = 11
font-weight = 700
display-icon = false
icon = "enter.svg"
icon-size = 16
color = "#202342"
paint-icon = true
spacing = 0

[LoginScreen]
background = "great-wave-pixel.png"
use-background-color = false
background-color = "#000000"
blur = 24
brightness = 0.05
saturation = 0.0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "square"
border-radius = 0
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 3
inactive-border-size = 2
active-border-color = "#202342"
inactive-border-color = "#355669"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "Monaspace Krypton NF"
font-size = 16
font-weight = 800
color = "#202342"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = true
font-family = "Monaspace Krypton NF"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#202342"
background-color = "#E7DEBF"
background-opacity = 0.9
border-size = 2
border-color = "#202342"
border-radius-left = 0
border-radius-right = 0
margin-top = 10
masked-character = "■"

[LoginScreen.LoginArea.LoginButton]
background-color = "#202342"
background-opacity = 1.0
active-background-color = "#355669"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#E7DEBF"
active-content-color = "#E7DEBF"
border-size = 2
border-color = "#202342"
border-radius-left = 0
border-radius-right = 0
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "Monaspace Krypton NF"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "Monaspace Krypton NF"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#202342"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "Monaspace Krypton NF"
font-size = 11
font-weight = 400
normal-color = "#202342"
warning-color = "#4B442A"
error-color = "#C34043"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 30
border-radius = 0
spacing = 10
font-family = "Monaspace Krypton NF"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#E7DEBF"
background-opacity = 0.95
active-option-background-color = "#7BAFA3"
active-option-background-opacity = 1.0
content-color = "#202342"
active-content-color = "#202342"
font-family = "Monaspace Krypton NF"
border-size = 2
border-color = "#202342"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#E7DEBF"
background-opacity = 0.9
active-background-opacity = 1.0
content-color = "#202342"
active-content-color = "#202342"
border-size = 2
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#E7DEBF"
background-opacity = 0.9
active-background-opacity = 1.0
content-color = "#202342"
active-content-color = "#202342"
border-size = 2
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "#E7DEBF"
background-opacity = 0.9
active-background-opacity = 1.0
content-color = "#202342"
active-content-color = "#202342"
border-size = 2
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#E7DEBF"
background-opacity = 0.9
active-background-opacity = 1.0
content-color = "#202342"
active-content-color = "#202342"
border-size = 2
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#E7DEBF"
background-opacity = 0.95
key-content-color = "#202342"
key-color = "#C0BB9E"
key-opacity = 1.0
key-active-background-color = "#7BAFA3"
key-active-opacity = 1.0
selection-background-color = "#7BAFA3"
selection-content-color = "#202342"
primary-color = "#355669"
border-size = 2
border-color = "#202342"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "Monaspace Krypton NF"
font-size = 11
content-color = "#E7DEBF"
background-color = "#202342"
background-opacity = 0.95
border-radius = 0
disable-user = false
disable-login-button = false
