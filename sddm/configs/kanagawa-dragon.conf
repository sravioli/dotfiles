# Kanagawa Dragon: SilentSDDM preset built on the stock default.conf, with the Great Wave on
# black (backgrounds/great-wave-oled.jpg). Palette sampled from the image:
#   black #000000  foam #F2F1E8  navy #01175D  prussian #0E5697  teal #64ADB6 / #96CCC9  boat #D9B07A
# The wave fills the left; clock, login form and bottom buttons all sit in the black on the
# right, so the art stays sharp (no blur). The session button is moved right for the same reason.
# Positions are tuned for an 1800x1125 logical screen (2880x1800 at 1.6 scale).
# LockScreen padding-right is shared by the clock and the message. The message icon is the
# Nerd Font login glyph (U+F0342) inside the text, so it sits on the same line (needs Monaspace NF).

; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 0.75
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 140
padding-bottom = 40
padding-left = 0
background = "great-wave-oled.jpg"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = 0.0
saturation = 0.0
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "center-right"
align = "right"
format = "hh:mm"
font-family = "Monaspace Krypton NF"
font-size = 130
font-weight = 800
color = "#F2F1E8"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "Monaspace Krypton NF"
font-size = 16
font-weight = 600
color = "#64ADB6"
margin-top = -4

[LockScreen.Message]
display = true
position = "bottom-right"
align = "right"
text = "press any key 󰍂"
font-family = "Monaspace Krypton NF"
font-size = 11
font-weight = 600
display-icon = false
icon = "enter.svg"
icon-size = 16
color = "#96CCC9"
paint-icon = true
spacing = 0

[LoginScreen]
background = "great-wave-oled.jpg"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = -0.15
saturation = 0.0

[LoginScreen.LoginArea]
position = "right"
margin = 160

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.5
active-border-size = 3
inactive-border-size = 2
active-border-color = "#64ADB6"
inactive-border-color = "#0E5697"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "Monaspace Krypton NF"
font-size = 18
font-weight = 800
color = "#F2F1E8"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 150
height = 30
display-icon = false
font-family = "Monaspace Krypton NF"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#000000"
background-color = "#F2F1E8"
background-opacity = 1.0
border-size = 0
border-color = "#FFFFFF"
border-radius-left = 15
border-radius-right = 0
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#F2F1E8"
background-opacity = 1.0
active-background-color = "#96CCC9"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#0E5697"
active-content-color = "#000000"
border-size = 0
border-color = "#FFFFFF"
border-radius-left = 0
border-radius-right = 15
margin-left = 0
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "Monaspace Krypton NF"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "Monaspace Krypton NF"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#64ADB6"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "Monaspace Krypton NF"
font-size = 11
font-weight = 400
normal-color = "#F2F1E8"
warning-color = "#D9B07A"
error-color = "#E46876"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 30
border-radius = 6
spacing = 10
font-family = "Monaspace Krypton NF"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#050A14"
background-opacity = 0.95
active-option-background-color = "#0E5697"
active-option-background-opacity = 1.0
content-color = "#F2F1E8"
active-content-color = "#F2F1E8"
font-family = "Monaspace Krypton NF"
border-size = 1
border-color = "#64ADB6"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-right"
index = 3
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#0E5697"
background-opacity = 0.0
active-background-opacity = 0.6
content-color = "#96CCC9"
active-content-color = "#F2F1E8"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#0E5697"
background-opacity = 0.0
active-background-opacity = 0.6
content-color = "#96CCC9"
active-content-color = "#F2F1E8"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "#0E5697"
background-opacity = 0.0
active-background-opacity = 0.6
content-color = "#96CCC9"
active-content-color = "#F2F1E8"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#0E5697"
background-opacity = 0.0
active-background-opacity = 0.6
content-color = "#96CCC9"
active-content-color = "#F2F1E8"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#050A14"
background-opacity = 0.95
key-content-color = "#F2F1E8"
key-color = "#01175D"
key-opacity = 1.0
key-active-background-color = "#0E5697"
key-active-opacity = 1.0
selection-background-color = "#64ADB6"
selection-content-color = "#000000"
primary-color = "#64ADB6"
border-size = 1
border-color = "#64ADB6"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "Monaspace Krypton NF"
font-size = 11
content-color = "#F2F1E8"
background-color = "#050A14"
background-opacity = 0.95
border-radius = 5
disable-user = false
disable-login-button = false
