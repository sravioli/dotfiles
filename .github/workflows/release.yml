name: release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cog needs the history and the earlier tags
      - uses: cocogitto/cocogitto-action@v4
        id: cog
        with:
          command: changelog
          args: --at ${{ github.ref_name }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.cog.outputs.stdout }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
