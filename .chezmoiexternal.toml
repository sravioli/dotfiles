# Cloned only when missing; afterwards they're normal repos you pull/push yourself (no refreshPeriod).
[".config/nvim"]
type = "git-repo"
url = "https://github.com/sravioli/nvim.git"

[".config/wezterm"]
type = "git-repo"
url = "https://github.com/sravioli/wezterm.git"

# kanagawa-community/delta install steps: theme gitconfigs into ~/.config/delta
[".config/delta"]
type = "archive"
url = "https://codeload.github.com/kanagawa-community/delta/tar.gz/refs/tags/1.0.0"
stripComponents = 2
include = ["*/themes/*.gitconfig"]

# kanagawa-community/oh-my-posh themes into ~/.config/oh-my-posh/themes, selected in conf.d/prompt.fish
[".config/oh-my-posh/themes"]
type = "archive"
url = "https://codeload.github.com/kanagawa-community/oh-my-posh/tar.gz/refs/tags/1.1.0"
stripComponents = 2
include = ["*/themes/*.omp.json"]

# kanagawa-community/bat install steps; no release yet, so pinned to a commit (bump SHA to update)
[".config/bat/themes"]
type = "archive"
url = "https://codeload.github.com/kanagawa-community/bat/tar.gz/7627164434c3733326c219c8baa13fdc578c33a7"
stripComponents = 2
include = ["*/themes/*.tmTheme"]

# kanagawa-community/btop themes into ~/.config/btop/themes, selected in btop.conf
[".config/btop/themes"]
type = "archive"
url = "https://codeload.github.com/kanagawa-community/btop/tar.gz/refs/tags/1.0.0"
stripComponents = 2
include = ["*/themes/*.theme"]

# GitAlias aliases, included from ~/.gitconfig; downloaded on install, refreshed weekly on apply
[".config/git/gitalias.gitconfig"]
type = "file"
url = "https://raw.githubusercontent.com/GitAlias/gitalias/main/gitalias.txt"
refreshPeriod = "168h"

# spicetify theme and marketplace, applied to Spotify by run_onchange_after_install-spicetify.sh.tmpl
[".config/spicetify/Themes/Text"]
type = "archive"
url = "https://codeload.github.com/spicetify/spicetify-themes/tar.gz/faefe18f483b4b905082767757bc026116a4d4a6"
stripComponents = 2
include = ["*/text/*.*"]  # theme files only, not the screenshots folder

[".config/spicetify/CustomApps/marketplace"]
type = "archive"
url = "https://github.com/spicetify/marketplace/releases/download/v1.0.12/marketplace.zip"
format = "zip"
stripComponents = 1
